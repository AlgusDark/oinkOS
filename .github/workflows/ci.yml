name: CI (build)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Push to main, or a pull request whose head repo is this one. Fork PRs stay false.
env:
  PUBLISH: "${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}"

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31

      - name: Run clang-format
        run: |
          nix develop --command ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v2-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-v2-${{ runner.os }}-

      - name: Install cppcheck runtime dependency
        run: |
          # pioarduino's Linux cppcheck binary links against libpcre.so.3.
          # In newer Ubuntu runner images where libpcre3 is omitted from apt sources,
          # download from Ubuntu archive over HTTPS and verify SHA-256 before installation.
          sudo apt-get update
          if ! sudo apt-get install -y --no-install-recommends libpcre3; then
            PKG="libpcre3_8.39-13ubuntu0.22.04.1_amd64.deb"
            SHA256="0d1eb051047eb0c637c893f618f45e1d419863bfa3bc821897ee05ad418ba22e"
            wget -q "https://security.ubuntu.com/ubuntu/pool/main/p/pcre3/${PKG}"
            echo "${SHA256}  ${PKG}" | sha256sum -c -
            sudo dpkg -i "${PKG}"
            rm -f "${PKG}"
          fi

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build:
    name: Build oinkos
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ env.PUBLISH }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-oinkos-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-v3-${{ runner.os }}-oinkos-

      # PlatformIO's build_cache_dir. Unchanged sources reuse their objects; a
      # platformio.ini change starts a fresh cache so old objects do not pile up.
      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: .cache
          key: pio-objects-${{ runner.os }}-oinkos-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: pio-objects-${{ runner.os }}-oinkos-${{ hashFiles('platformio.ini') }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # oinkos sets custom_sdkconfig, so PlatformIO runs a nested `pio run` from
          # ~/.platformio/penv. The platform bootstraps that penv with an open-ended
          # "pioarduino>=6.1.19", which now resolves to 6.2.0. That core wants
          # tool-scons 4.11.1 while platform 55.03.311 pins 4.8.1; the two keep
          # reinstalling over each other and the running SCons loses its package
          # mid-build ("No module named 'SCons.Tool.FortranCommon'"). Keep the penv
          # core on the same version as the outer core installed above.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e oinkos
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build oinkos firmware
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            export OINKOS_BUILD="${{ github.run_number }}"
          fi
          pio run -e oinkos | tee pio.log

      - name: Check published version
        id: version
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^CrossPoint build version: //p' pio.log | head -n1)"
          # Check for Updates compares exactly three numbers.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$version' is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          grep -aq "$version" .pio/build/oinkos/firmware.bin
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## oinkos firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
            echo "- Object cache: $(du -sh .cache | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: oinkos.bin
          path: .pio/build/oinkos/firmware.bin
          if-no-files-found: error
          compression-level: 0

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  publish:
    needs: [build, clang-format, cppcheck, unit-tests]
    if: needs.build.outputs.publish == 'true'
    permissions:
      contents: write
    concurrency:
      group: oinkos-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: oinkos.bin
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          asset="oinkos-${VERSION}-x3-x4.bin"
          mv dist/firmware.bin "$asset"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            channel=beta
            target="$PR_SHA"
            notes="PR #${PR_NUMBER}: ${PR_TITLE} ${PR_SHA}"
          else
            channel=nightly
            target="$GITHUB_SHA"
            notes="${COMMIT_MESSAGE%%$'\n'*} ${GITHUB_SHA}"
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$VERSION" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target" \
              --title "oinkOS ${VERSION}" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi
          scripts/publish_channel.sh "$VERSION" "$channel"

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
